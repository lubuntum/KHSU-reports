{% extends "base.html" %}

{%block title %} Составление отчетов {% endblock %}

{% block content %}


<div class="form-container">
    <div class="hero-section">
        <p>Введите имя преподователя в формате Иванов И.И.</p>
        <p>Месяц номер от 1 до 12</p>
    </div>
    <form action="generate-report" method="post" id="reportForm">
        <div class="form-group">
            <label for="teacher">
                <span class="required">*</span> Имя преподавателя:
            </label>
            <input type="text"
                    id="teacher"
                    name="teacher"
                    placeholder="Иванов И.И."
                    required
                    autocomplete="off">
        </div>
        <div class="form-group">
            <label for="month">
                <span class="required">*</span> Месяц
            </label>
            <select id="month" name="month" required>
                <option value="">Выберите месяц</option>
                {% for month in months %}
                <option value="{{ month.number }}">{{ month.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Составить</button>
    </form>
    <div id="loadingMessage" style="display: none;" class="loading-message">
        <div class="spinner"></div>
        <p>Составляем отчет, пожалуйста подождите...</p>
    </div>
</div>
{% endblock %}
    {% block extra_scripts %}
    <script>
        const submitBtn = document.getElementById("submitBtn")
        const loadingMsg = document.getElementById("loadingMessage")
        const reportForm = document.getElementById("reportForm")
        document.getElementById('reportForm').addEventListener('submit', async function (e) {
            e.preventDefault()
            const formData = new FormData(reportForm)
            const teacher = formData.get("teacher")
            const month = formData.get("month")
            if (!teacher || !teacher.trim()) {
                showError("Пожалуйста введите имя препода")
                return
            }
            if (!month) {
                showError("Введите месяц")
                return
            }
            submitBtn.disabled = true
            loadingMsg.style.display = 'block'
            hideError()

            try {
                const response = await fetch('/generate-report', {
                    method: 'POST',
                    body: formData
                })
                if (!response.ok) {
                    const errorData = await response.json()
                    errorMessage = errorData.detail || errorData.message || `HTTP ${response.status}`
                    throw new Error(errorMessage)
                }
                const contentType = response.headers.get('content-type');
            
            if (contentType && contentType.includes('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')) {
                const blob = await response.blob()
                const url = window.URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url

                const filename = `${teacher}_${extractMonthName()}.xlsx`
                a.download = filename
                document.body.appendChild(a)
                a.click()
                document.body.removeChild(a)
                window.URL.revokeObjectURL(url)
                showSuccess(`Отчет для преподователя готов!`)
            }
            } catch (err) {
                console.error('Error: ', err)
                showError(err.message || "Ошибка генерации, попробуйте еще раз")
            } finally {
                submitBtn.disabled = false
                loadingMsg.style.display = 'none'
            }
        })
        // Helper functions
        function extractMonthName() {
            const monthSelect = document.getElementById("month")
            if (!monthSelect) {
                console.error("Month select element not found");
                return "";
            }
            return monthSelect.options[monthSelect.selectedIndex]?.text
        }
        function showError(message) {
            hideError();
            const errorDiv = document.createElement('div');
            errorDiv.id = 'errorMessage';
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                <div class="alert alert-error">
                    <strong> Ошибка:</strong> ${escapeHtml(message)}
                </div>
            `;
            reportForm.insertAdjacentElement('beforebegin', errorDiv);
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                const elem = document.getElementById('errorMessage');
                if (elem) elem.remove();
            }, 5000);
        }
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = `
                <div class="alert alert-success">
                    <strong>Успешно:</strong> ${escapeHtml(message)}
                </div>
            `;
            reportForm.insertAdjacentElement('beforebegin', successDiv);
            
            // Auto-hide after 3 seconds
            setTimeout(() => {
                if (successDiv) successDiv.remove();
            }, 3000);
        }
        function hideError() {
            const existingError = document.getElementById('errorMessage');
            if (existingError) existingError.remove();
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    {% endblock %}
